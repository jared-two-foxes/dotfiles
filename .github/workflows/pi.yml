name: Pi and CLI installers

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: jared-two-foxes/scaffold
          # Task-only Scaffold contract after SA-599: .scaffold/.tasks.lock, schema-v2 issue graph.
          ref: 11ff2c41905001440a6acb92306c563d2d9fe249
          path: .ci-scaffold
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.test.mjs
        env:
          SCAFFOLD_SOURCE: ${{ github.workspace }}/.ci-scaffold

  installers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/pi-feature-validation.test.mjs tests/pi-review.test.mjs tests/pi-scaffold.test.mjs tests/pi-delivery-state.test.mjs tests/pi-task-workflow.test.mjs tests/pi-checkpoint.test.mjs tests/pi-conductor.test.mjs tests/conductor-v2-integration.test.mjs tests/pi-automatic-commit.test.mjs
      - shell: pwsh
        run: |
          ./tests/install-conductor.ps1
          ./tests/install-executor.ps1
          ./tests/install-review.ps1
