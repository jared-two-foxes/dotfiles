name: Pi and CLI installers

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: jared-two-foxes/scaffold
          # Scaffold SA-607 adds per-initialization identity after clean.
          ref: 9987c141ca0b107d9f7cf25e3d0c98e20b7824dc
          path: .ci-scaffold
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Scaffold and pytest
        run: python -m pip install -e ./.ci-scaffold pytest
      - name: Verify native Scaffold task lifecycle (Linux)
        working-directory: .ci-scaffold
        run: python -m pytest -q tests
      - name: Verify task-only cross-repository CLI (Linux)
        run: python -m pytest -q tests/test_scaffold_cutover.py
      - name: Run Pi and real-Scaffold integration tests
        run: node --test tests/*.test.mjs
        env:
          SCAFFOLD_SOURCE: ${{ github.workspace }}/.ci-scaffold
      - name: Verify feature authorization (isolated module mocks)
        run: node --experimental-test-module-mocks --test tests/pi-feature-authorization.test.mjs

  installers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: jared-two-foxes/scaffold
          # Verify the same SA-607 Scaffold feature-identity commit used on Linux.
          ref: 9987c141ca0b107d9f7cf25e3d0c98e20b7824dc
          path: .ci-scaffold
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Scaffold and pytest
        run: python -m pip install -e ./.ci-scaffold pytest
      - name: Verify native Scaffold task lifecycle (Windows)
        working-directory: .ci-scaffold
        run: python -m pytest -q tests
      - name: Verify task-only cross-repository CLI (Windows)
        run: python -m pytest -q tests/test_scaffold_cutover.py
      - name: Verify feature authorization (isolated module mocks)
        run: node --experimental-test-module-mocks --test tests/pi-feature-authorization.test.mjs
      - run: node --test tests/pi-feature-validation.test.mjs tests/pi-review.test.mjs tests/pi-scaffold.test.mjs tests/pi-delivery-state.test.mjs tests/pi-task-workflow.test.mjs tests/pi-checkpoint.test.mjs tests/pi-conductor.test.mjs tests/conductor-v2-integration.test.mjs tests/pi-automatic-commit.test.mjs
      - shell: pwsh
        run: |
          ./tests/install-conductor.ps1
          ./tests/install-executor.ps1
          ./tests/install-review.ps1
