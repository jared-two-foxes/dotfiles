name: OpenCode and CLI installers

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: jared-two-foxes/scaffold
          # Recursive issue lifecycle contract; pin the companion Scaffold implementation.
          ref: 6c37ae6260476f95e10a4e816a233e8bdcf24d1e
          path: .ci-scaffold
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.test.mjs
        env:
          SCAFFOLD_SOURCE: ${{ github.workspace }}/.ci-scaffold

  installers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/pi-feature-validation.test.mjs tests/pi-review.test.mjs tests/pi-scaffold.test.mjs tests/pi-task-workflow.test.mjs tests/pi-checkpoint.test.mjs
      - shell: pwsh
        run: |
          ./tests/install-conductor.ps1
          ./tests/install-executor.ps1
