name: OpenCode and CLI installers

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/execute-and-review.test.mjs tests/executor-runner.test.mjs tests/review-runner.test.mjs tests/pi-conductor.test.mjs tests/pi-design.test.mjs

  installers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          ./tests/install-conductor.ps1
          ./tests/install-executor.ps1
