[project]
name = "dependency-codegen"
version = "0.1.0"
description = "Dependency-driven code generation CLI using acceptance criteria."
requires-python = ">=3.11"
dependencies = [
    "ticket-pipeline @ file:../ticket-pipeline",
]

[project.scripts]
dep-scaffold = "dependency_codegen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dependency_codegen", "dependency_codegen.*"]
